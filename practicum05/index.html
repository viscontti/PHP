<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гаманець — Практикум №5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <h1>Гаманець</h1>
        <p>Трекер особистих витрат</p>
    </header>

    <main class="layout">
        <section class="card">
            <!-- Баланс над таблицею: оновлюється після додавання транзакції -->
            <p class="receipt-total-label">Баланс</p>
            <p class="receipt-total" id="balance">—</p>

            <!-- Крок 2. Поле пошуку і порожній контейнер для результатів -->
            <div class="field search">
                <label for="search">Пошук за категорією</label>
                <input type="search" id="search" autocomplete="off">
            </div>

            <p class="alert alert-error" id="message" hidden></p>

            <table id="results" class="tx-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Дата</th>
                        <th>Категорія</th>
                        <th class="num">Сума</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <form id="add-form" class="card">
            <h2>Нова транзакція</h2>
            <div class="field">
                <label for="amount">Сума, грн</label>
                <input type="number" id="amount" name="amount" step="0.01" min="-99999999.99" max="99999999.99" required>
            </div>
            <div class="field">
                <label for="category">Категорія</label>
                <input type="text" id="category" name="category" required maxlength="100">
            </div>
            <div class="field">
                <label for="date">Дата</label>
                <input type="date" id="date" name="transaction_date" required>
            </div>
            <button type="submit" class="btn">Додати</button>
        </form>
    </main>

    <footer class="page-footer">
        Практична робота №5 · Варіант 13
    </footer>

    <script src="script.js"></script>
</body>
</html>
